<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found | ELWOIC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: Arial, sans-serif;

      background: linear-gradient(
        135deg,
        #eef8ff,
        #ffffff
      );

      color: #17365d;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow-x: hidden;
    }

    /* Main 404 area */
    .page {
      width: 100%;
      max-width: 1100px;
      min-height: 650px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px;
      gap: 30px;
    }


    /* -------------------------
       LEFT SIDE
       ------------------------- */

    .message {
      width: 50%;
      max-width: 500px;
      z-index: 2;
    }

    .error-code {
      font-size: 110px;
      line-height: 1;

      margin: 0;

      font-weight: 800;

      color: #2878bd;
    }

    h1 {
      font-size: 38px;
      margin: 15px 0 12px;
    }

    .description {
      font-size: 17px;
      line-height: 1.7;

      color: #5c7187;

      margin-bottom: 25px;
    }


    /* Requested URL */
    .requested-page {
      display: inline-block;

      max-width: 100%;

      padding: 10px 15px;

      background: rgba(255,255,255,0.8);

      border: 1px solid #dceaf5;

      border-radius: 9px;

      font-family: monospace;

      color: #55718b;

      word-break: break-all;
    }


    /* Buttons */
    .buttons {
      margin-top: 25px;
    }

    .button {
      display: inline-block;

      padding: 13px 21px;

      margin-right: 7px;

      border-radius: 10px;

      text-decoration: none;

      font-weight: 600;

      background: #2878bd;

      color: white;

      transition: 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .button.secondary {
      background: #e6f0f7;
      color: #31536f;
    }


    /* -------------------------
       CHARACTER
       ------------------------- */

    .character-area {
      width: 50%;

      min-height: 520px;

      display: flex;

      align-items: flex-end;

      justify-content: center;

      position: relative;
    }

    .character-video {
      width: 100%;
      max-width: 500px;

      height: auto;

      display: block;

      object-fit: contain;

      /* Removes the ugly inline-video gap */
      vertical-align: bottom;
    }


    /* -------------------------
       FOOTER
       ------------------------- */

    .footer {
      position: absolute;

      bottom: 20px;

      left: 0;
      right: 0;

      text-align: center;

      font-size: 13px;

      color: #91a7ba;
    }


    /* -------------------------
       MOBILE
       ------------------------- */

    @media (max-width: 750px) {

      body {
        align-items: flex-start;
      }

      .page {
        flex-direction: column-reverse;

        padding: 30px 20px 80px;

        gap: 0;
      }

      .message {
        width: 100%;

        text-align: center;
      }

      .character-area {
        width: 100%;

        min-height: auto;

        margin-bottom: -20px;
      }

      .character-video {
        max-width: 360px;
      }

      .error-code {
        font-size: 80px;
      }

      h1 {
        font-size: 30px;
      }

      .buttons {
        margin-top: 20px;
      }

      .button {
        margin: 5px;
      }

      .footer {
        position: static;

        margin-top: 20px;

        padding-bottom: 15px;
      }
    }

  </style>
</head>


<body>

  <main class="page">

    <!-- =========================
         404 MESSAGE
         ========================= -->

    <section class="message">

      <div style="font-size: 45px;">🌦️</div>

      <h2 class="error-code">404</h2>

      <h1>Page Not Found</h1>

      <p class="description">
        Sorry, the page you're looking for doesn't exist,
        may have been moved, or is currently under construction.
      </p>

      <div class="requested-page" id="requestedPage"></div>

      <div class="buttons">

        <a href="/" class="button">
          🏠 Go to ELWOIC
        </a>

        <a href="/Forecast.html" class="button secondary">
          🌤️ Weather Forecast
        </a>

      </div>

    </section>


    <!-- =========================
         ELWOIC CHARACTER
         ========================= -->

    <section class="character-area">

      <video
        class="character-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto">

        <source
          src="elwoic-character.webm"
          type="video/webm">

        Your browser does not support video.
      </video>

    </section>

  </main>


  <div class="footer">

    Elamkulam Local Weather Observation And Information Centre
    <br>
    ELWOIC

  </div>


  <script>

    /*
      Automatically display the URL
      that the visitor tried to open.
    */

    document.getElementById("requestedPage").textContent =
      window.location.pathname;

  </script>

</body>
</html>
