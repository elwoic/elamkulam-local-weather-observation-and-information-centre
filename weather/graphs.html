<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELWOIC Data Explorer</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            elwoic: {
              red: '#ef4444',
              blue: '#3b82f6',
              green: '#10b981',
              orange: '#f59e0b',
              purple: '#8b5cf6',
              teal: '#14b8a6',
              surface: '#ffffff',
              bg: '#f8fafc'
            }
          }
        }
      }
    }
  </script>
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-elwoic-bg text-slate-800 font-sans antialiased p-4 md:p-8">

  <!-- Header & Controls Toolbar -->
  <div class="max-w-6xl mx-auto mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 pb-5">
    <div>
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">ELWOIC Data Explorer</h1>
      <p class="text-slate-500 text-sm mt-0.5">Live and historical telemetry from Elamkulam</p>
    </div>
    
    <div class="flex flex-wrap items-center gap-3">
      <!-- Resolution / Aggregation Selector -->
      <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">
        <label for="resolution-select" class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Resolution</label>
        <select id="resolution-select" onchange="setResolution(this.value)" class="...">
  <option value="raw">Raw (Full Detail)</option>
  <option value="15m">15-Min Avg</option>
  <option value="1h" selected>1-Hour Avg</option>
  <option value="6h">6-Hour Avg</option>
</select>
      </div>

      <!-- Time Range Buttons -->
      <div class="flex bg-slate-200/80 rounded-lg p-1" role="group">
        <button onclick="setGlobalRange('24h')" id="btn-global-24h" class="global-range-btn px-3.5 py-1.5 text-xs font-medium rounded-md bg-white shadow-sm text-slate-800 transition-all">24h</button>
        <button onclick="setGlobalRange('7d')" id="btn-global-7d" class="global-range-btn px-3.5 py-1.5 text-xs font-medium rounded-md text-slate-600 hover:text-slate-900 transition-all">7d</button>
        <button onclick="setGlobalRange('30d')" id="btn-global-30d" class="global-range-btn px-3.5 py-1.5 text-xs font-medium rounded-md text-slate-600 hover:text-slate-900 transition-all">30d</button>
      </div>
    </div>
  </div>

  <!-- Category Tabs -->
  <div class="max-w-6xl mx-auto mb-6">
    <nav class="flex space-x-6 overflow-x-auto hide-scrollbar border-b border-slate-200" aria-label="Tabs">
      <button onclick="switchTab('atmosphere')" id="tab-btn-atmosphere" class="tab-btn border-b-2 border-elwoic-blue py-3 px-1 text-sm font-semibold text-elwoic-blue whitespace-nowrap">Atmosphere</button>
      <button onclick="switchTab('wind_rain')" id="tab-btn-wind_rain" class="tab-btn border-b-2 border-transparent py-3 px-1 text-sm font-medium text-slate-500 hover:text-slate-700 whitespace-nowrap">Wind & Rain</button>
      <button onclick="switchTab('aqi')" id="tab-btn-aqi" class="tab-btn border-b-2 border-transparent py-3 px-1 text-sm font-medium text-slate-500 hover:text-slate-700 whitespace-nowrap">Air Quality</button>
      <button onclick="switchTab('indoor')" id="tab-btn-indoor" class="tab-btn border-b-2 border-transparent py-3 px-1 text-sm font-medium text-slate-500 hover:text-slate-700 whitespace-nowrap">Indoor</button>
    </nav>
  </div>

  <!-- Graph Grid -->
  <div class="max-w-6xl mx-auto">
    <div id="graphs-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <!-- Chart cards injected by JS -->
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="expand-modal" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 transition-opacity duration-200">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl overflow-hidden flex flex-col max-h-[90vh]">
      
      <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <div>
          <h2 id="modal-title" class="text-xl font-bold text-slate-800">Graph Details</h2>
          <p id="modal-subtitle" class="text-xs text-slate-500">Live Telemetry Analysis</p>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-lg hover:bg-slate-100">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      
      <div class="p-6 flex flex-col lg:flex-row gap-6 overflow-y-auto">
        <div class="flex-grow relative h-[320px] md:h-[420px]">
          <canvas id="modalChart"></canvas>
        </div>
        
        <div class="w-full lg:w-72 flex flex-col gap-3">
          <h3 class="font-bold text-slate-400 uppercase tracking-wider text-[11px]">Period Summary</h3>
          
          <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-100">
            <p class="text-xs text-slate-500 mb-0.5">Current Value</p>
            <p id="trend-current" class="text-2xl font-black text-slate-800">--</p>
          </div>

          <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-100">
            <p class="text-xs text-slate-500 mb-0.5">Average</p>
            <p id="trend-avg" class="text-xl font-bold text-slate-700">--</p>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="bg-red-50/70 p-3 rounded-xl border border-red-100">
              <p class="text-[10px] text-red-500 uppercase font-bold mb-0.5">Peak</p>
              <p id="trend-max" class="text-base font-bold text-red-700">--</p>
            </div>
            <div class="bg-blue-50/70 p-3 rounded-xl border border-blue-100">
              <p class="text-[10px] text-blue-500 uppercase font-bold mb-0.5">Minimum</p>
              <p id="trend-min" class="text-base font-bold text-blue-700">--</p>
            </div>
          </div>
          
          <p id="trend-status" class="text-xs text-slate-400 mt-2 italic">Ready</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://elwoic-charts-api.bold-waterfall-0d01.workers.dev";
    
    let currentGlobalRange = '24h';
    let currentActiveTab = 'atmosphere';
    let currentResolution = '1h';
    let activeChartInstances = {}; 
    let modalChartInstance = null;
    let modalActiveConfig = null;

    // --- ACCURATE MICROGRAM BREAKPOINT COLORS ---
    function getRawPM25Color(ugm3) {
      if (ugm3 === null || isNaN(ugm3)) return '#cbd5e1';
      if (ugm3 <= 12.0)  return '#22c55e'; // Good (0-12 µg/m³)
      if (ugm3 <= 35.4)  return '#eab308'; // Moderate (12.1-35.4 µg/m³)
      if (ugm3 <= 55.4)  return '#f97316'; // Sensitive Groups (35.5-55.4 µg/m³)
      if (ugm3 <= 150.4) return '#ef4444'; // Unhealthy (55.5-150.4 µg/m³)
      if (ugm3 <= 250.4) return '#8b5cf6'; // Very Unhealthy (150.5-250.4 µg/m³)
      return '#881337';                    // Hazardous (250.5+ µg/m³)
    }

    function getDynamicColor(value, type) {
      if (value === null || isNaN(value)) return '#cbd5e1';
      if (type === 'pm02') return getRawPM25Color(value);
      if (type === 'pm10') {
        if (value <= 54)  return '#22c55e';
        if (value <= 154) return '#eab308';
        if (value <= 254) return '#f97316';
        if (value <= 354) return '#ef4444';
        return '#8b5cf6';
      }
      if (type === 'co2') return value <= 800 ? '#22c55e' : value <= 1200 ? '#eab308' : '#ef4444';
      if (type === 'tvoc_index' || type === 'nox_index') return value <= 100 ? '#22c55e' : value <= 200 ? '#eab308' : '#ef4444';
      return '#3b82f6';
    }

    // --- CONFIGURATION ---
    const tabsConfig = {
      atmosphere: [
        { param: 'outdoor_temp', title: 'Temperature', unit: '°C', color: '#ef4444' },
        { param: 'outdoor_humidity', title: 'Humidity', unit: '%', color: '#3b82f6' },
        { param: 'pressure_relative', title: 'Relative Pressure', unit: 'hPa', color: '#8b5cf6' },
        { param: 'solar_radiation', title: 'Solar Radiation', unit: 'W/m²', color: '#f59e0b' },
        { param: 'uvi', title: 'UV Index', unit: 'UVI', color: '#eab308' },
        { param: 'feels_like', title: 'Feels Like', unit: '°C', color: '#ec4899' },
        { param: 'vpd', title: 'Vapor Pressure Deficit', unit: 'kPa', color: '#6366f1' }
      ],
      wind_rain: [
        { param: 'wind_speed', title: 'Wind Speed', unit: 'km/h', color: '#10b981' },
        { param: 'wind_gust', title: 'Wind Gust', unit: 'km/h', color: '#059669' },
        { param: 'wind_dir', title: 'Wind Direction', unit: '°', color: '#64748b', yMin: 0, yMax: 360 },
        { param: 'rain_rate', title: 'Rain Rate', unit: 'mm/h', color: '#0ea5e9', multiplier: 25.4 },
        { param: 'rain_daily', title: 'Daily Rain', unit: 'mm', color: '#0284c7', multiplier: 25.4 },
        { param: 'dew_point', title: 'Dew Point', unit: '°C', color: '#8b5cf6' }
      ],
      aqi: [
        { param: 'pm02', title: 'PM 2.5 (Fine Particles)', unit: 'µg/m³', isAqi: true },
        { param: 'pm10', title: 'PM 10 (Coarse Particles)', unit: 'µg/m³', isAqi: true },
        { param: 'pm01', title: 'PM 1.0 (Ultrafine)', unit: 'µg/m³', color: '#14b8a6' },
        { param: 'co2', title: 'CO2 Concentration', unit: 'ppm', isAqi: true },
        { param: 'tvoc_index', title: 'TVOC Index', unit: 'Idx', isAqi: true },
        { param: 'nox_index', title: 'NOx Index', unit: 'Idx', isAqi: true }
      ],
      indoor: [
        { param: 'indoor_temp', title: 'Indoor Temperature', unit: '°C', color: '#f43f5e' },
        { param: 'indoor_humidity', title: 'Indoor Humidity', unit: '%', color: '#06b6d4' }
      ]
    };

    window.onload = () => {
      loadTabGraphs('atmosphere');
    };

    function switchTab(tabId) {
      if(currentActiveTab === tabId) return;
      currentActiveTab = tabId;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = "tab-btn border-b-2 border-transparent py-3 px-1 text-sm font-medium text-slate-500 hover:text-slate-700 whitespace-nowrap";
      });
      const activeBtn = document.getElementById(`tab-btn-${tabId}`);
      activeBtn.className = "tab-btn border-b-2 border-elwoic-blue py-3 px-1 text-sm font-semibold text-elwoic-blue whitespace-nowrap";
      loadTabGraphs(tabId);
    }

    function setGlobalRange(range) {
      currentGlobalRange = range;
      document.querySelectorAll('.global-range-btn').forEach(btn => {
        btn.className = "global-range-btn px-3.5 py-1.5 text-xs font-medium rounded-md text-slate-600 hover:text-slate-900 transition-all";
      });
      document.getElementById(`btn-global-${range}`).className = "global-range-btn px-3.5 py-1.5 text-xs font-medium rounded-md bg-white shadow-sm text-slate-800 transition-all";
      loadTabGraphs(currentActiveTab);
    }

    function setResolution(res) {
      currentResolution = res;
      loadTabGraphs(currentActiveTab);
      if (modalActiveConfig && !document.getElementById('expand-modal').classList.contains('hidden')) {
        renderModalWithCurrentResolution(modalActiveConfig);
      }
    }

    // --- DOWNSAMPLING ENGINE ---
    function aggregateData(labels, data, resolution) {
      if (resolution === 'raw' || !data || data.length === 0) {
        return { labels, data };
      }

      // Approximate standard 5-minute raw interval stepping
      let bucketSize = 1;
      if (resolution === '15m') bucketSize = 3;
      if (resolution === '1h')  bucketSize = 12;
      if (resolution === '6h')  bucketSize = 72;

      if (data.length <= bucketSize) {
        return { labels, data };
      }

      const outLabels = [];
      const outData = [];

      for (let i = 0; i < data.length; i += bucketSize) {
        const chunk = data.slice(i, i + bucketSize).filter(v => v !== null && !isNaN(v));
        outLabels.push(labels[i]);
        if (chunk.length === 0) {
          outData.push(null);
        } else {
          const avg = chunk.reduce((sum, val) => sum + val, 0) / chunk.length;
          outData.push(Number(avg.toFixed(2)));
        }
      }
      return { labels: outLabels, data: outData };
    }

    async function loadTabGraphs(tabId) {
      const grid = document.getElementById('graphs-grid');
      grid.innerHTML = ''; 
      
      Object.keys(activeChartInstances).forEach(key => activeChartInstances[key].destroy());
      activeChartInstances = {};

      const configs = tabsConfig[tabId];
      
      // Render card skeletons
      configs.forEach(conf => {
        const cardHtml = `
          <div class="bg-white border border-slate-200/80 rounded-xl shadow-xs p-4 flex flex-col justify-between h-[280px] hover:border-slate-300 transition-all">
            <div class="flex justify-between items-start mb-2">
              <div>
                <h3 class="font-medium text-slate-700 text-sm">${conf.title}</h3>
                <div id="stat-${conf.param}" class="text-xl font-black text-slate-900 mt-0.5 tracking-tight">--</div>
              </div>
              <button onclick='openModalFromTab("${conf.param}")' title="Expand Chart" class="text-slate-400 hover:text-elwoic-blue transition-colors p-1.5 rounded-md hover:bg-slate-50">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
              </button>
            </div>
            
            <div class="relative flex-grow w-full h-[180px]">
              <div id="loader-${conf.param}" class="absolute inset-0 flex items-center justify-center bg-white/70 z-10 rounded-lg">
                <span class="text-xs font-semibold text-slate-400 animate-pulse">Loading telemetry...</span>
              </div>
              <canvas id="canvas-${conf.param}"></canvas>
            </div>
          </div>
        `;
        grid.insertAdjacentHTML('beforeend', cardHtml);
      });

      // Fetch and draw
      configs.forEach(async (conf) => {
        try {
          const res = await fetch(`${API_BASE}/?param=${conf.param}&range=${currentGlobalRange}`);
          const json = await res.json();
          
          const rawProcessedData = conf.multiplier 
            ? json.data.map(v => v !== null ? (v * conf.multiplier) : null) 
            : json.data;

          // Save raw cache
          conf.rawLabels = json.labels;
          conf.rawData = rawProcessedData;

          // Compute latest stat
          const valid = rawProcessedData.filter(v => v !== null && !isNaN(v));
          const latestVal = valid.length > 0 ? valid[valid.length - 1] : null;
          const statBadge = document.getElementById(`stat-${conf.param}`);
          if (statBadge) {
            statBadge.innerText = latestVal !== null ? `${Number(latestVal.toFixed(1))} ${conf.unit}` : '--';
          }

          document.getElementById(`loader-${conf.param}`).style.display = 'none';
          
          const { labels, data } = aggregateData(conf.rawLabels, conf.rawData, currentResolution);
          const ctx = document.getElementById(`canvas-${conf.param}`).getContext('2d');
          activeChartInstances[conf.param] = createChart(ctx, labels, data, conf, false);
        } catch (err) {
          const loader = document.getElementById(`loader-${conf.param}`);
          if (loader) loader.innerHTML = '<span class="text-xs font-semibold text-rose-500">Failed to load</span>';
        }
      });
    }

    function createChart(ctx, labels, data, config, isLargeModal) {
      const showDots = isLargeModal && currentResolution === 'raw';

      const chartOptions = {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: `${config.title} (${config.unit})`,
            data: data,
            borderColor: config.isAqi ? '#94a3b8' : (config.color || '#3b82f6'),
            borderWidth: isLargeModal ? 2 : 1.5,
            pointRadius: showDots ? 2 : 0,
            pointHoverRadius: 5,
            fill: false,
            tension: 0.15,
            spanGaps: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { intersect: false, mode: 'index' },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(15, 23, 42, 0.9)',
              padding: 10,
              callbacks: {
                label: (ctx) => `${ctx.parsed.y !== null ? ctx.parsed.y.toFixed(2) : '--'} ${config.unit}`
              }
            }
          },
          scales: {
            x: { 
              grid: { display: false }, 
              ticks: { maxTicksLimit: isLargeModal ? 10 : 5, font: { size: 10 } } 
            },
            y: { 
              grid: { color: '#f1f5f9' }, 
              min: config.yMin, 
              max: config.yMax,
              ticks: { font: { size: 10 } }
            }
          }
        }
      };

      if (config.isAqi) {
        chartOptions.data.datasets[0].segment = {
          borderColor: (ctx) => getDynamicColor(ctx.p1.parsed.y, config.param)
        };
        chartOptions.data.datasets[0].pointBackgroundColor = (ctx) => getDynamicColor(ctx.raw, config.param);
      }

      if (config.param === 'wind_dir') {
        chartOptions.options.scales.y.ticks = { stepSize: 90 };
      }

      return new Chart(ctx, chartOptions);
    }

    function openModalFromTab(param) {
      const activeConfigs = tabsConfig[currentActiveTab];
      const liveConfig = activeConfigs.find(c => c.param === param);
      if (!liveConfig) return;

      modalActiveConfig = liveConfig;
      const modal = document.getElementById('expand-modal');
      document.getElementById('modal-title').innerText = liveConfig.title;
      document.getElementById('modal-subtitle').innerText = `Range: ${currentGlobalRange} | Resolution: ${currentResolution}`;
      
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);

      renderModalWithCurrentResolution(liveConfig);
    }

    function renderModalWithCurrentResolution(config) {
      if (!config.rawData) return;
      if (modalChartInstance) modalChartInstance.destroy();
      
      const { labels, data } = aggregateData(config.rawLabels, config.rawData, currentResolution);
      const ctx = document.getElementById('modalChart').getContext('2d');
      modalChartInstance = createChart(ctx, labels, data, config, true);
      calculateTrends(config.rawData, config.unit);
    }

    function closeModal() {
      const modal = document.getElementById('expand-modal');
      modal.classList.add('opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
        if (modalChartInstance) modalChartInstance.destroy();
        modalActiveConfig = null;
      }, 200);
    }

    function calculateTrends(dataArray, unit) {
      const validData = dataArray.filter(v => v !== null && !isNaN(v));
      
      if (validData.length === 0) {
        document.getElementById('trend-current').innerText = '--';
        document.getElementById('trend-avg').innerText = '--';
        document.getElementById('trend-max').innerText = '--';
        document.getElementById('trend-min').innerText = '--';
        document.getElementById('trend-status').innerText = "No readings logged in this period.";
        return;
      }

      const current = validData[validData.length - 1];
      const max = Math.max(...validData);
      const min = Math.min(...validData);
      const avg = validData.reduce((a, b) => a + b, 0) / validData.length;
      
      const fmt = (num) => Number.isInteger(num) ? num : num.toFixed(1);
      
      document.getElementById('trend-current').innerText = `${fmt(current)} ${unit}`;
      document.getElementById('trend-avg').innerText = `${fmt(avg)} ${unit}`;
      document.getElementById('trend-max').innerText = `${fmt(max)} ${unit}`;
      document.getElementById('trend-min').innerText = `${fmt(min)} ${unit}`;
      document.getElementById('trend-status').innerText = `Computed over ${validData.length} records (${currentResolution} view).`;
    }
  </script>
</body>
</html>
