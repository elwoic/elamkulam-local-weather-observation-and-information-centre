<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELWOIC Data Explorer</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            elwoic: { red: '#ef4444', blue: '#3b82f6', green: '#10b981', orange: '#f59e0b', purple: '#8b5cf6', teal: '#14b8a6', surface: '#ffffff', bg: '#f8fafc' }
          }
        }
      }
    }
  </script>

  <style>
    /* Hide scrollbar for quick nav */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-elwoic-bg text-slate-800 font-sans antialiased p-4 md:p-8">

  <!-- Header & Global Time Range -->
  <div class="max-w-6xl mx-auto mb-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h1 class="text-3xl font-bold tracking-tight">ELWOIC Data Explorer</h1>
      <p class="text-slate-500 text-sm mt-1">Live and historical telemetry from Elamkulam</p>
    </div>
    
    <div class="flex bg-slate-200 rounded-lg p-1" role="group">
      <button onclick="setGlobalRange('24h')" id="btn-global-24h" class="global-range-btn px-4 py-1.5 text-sm font-medium rounded-md bg-white shadow-sm text-slate-800 transition-all">24 Hours</button>
      <button onclick="setGlobalRange('7d')" id="btn-global-7d" class="global-range-btn px-4 py-1.5 text-sm font-medium rounded-md text-slate-500 hover:text-slate-800 transition-all">7 Days</button>
      <button onclick="setGlobalRange('30d')" id="btn-global-30d" class="global-range-btn px-4 py-1.5 text-sm font-medium rounded-md text-slate-500 hover:text-slate-800 transition-all">30 Days</button>
    </div>
  </div>

  <!-- Quick Navigation Index Bar -->
  <div class="max-w-6xl mx-auto mb-6 pb-2 overflow-x-auto whitespace-nowrap hide-scrollbar border-b border-slate-200">
    <div class="flex gap-2" id="quick-nav-container">
      <!-- Buttons injected by JavaScript -->
    </div>
  </div>

  <!-- Tabs Navigation -->
  <div class="max-w-6xl mx-auto mb-6">
    <nav class="flex space-x-6 overflow-x-auto hide-scrollbar" aria-label="Tabs">
      <button onclick="switchTab('atmosphere')" id="tab-btn-atmosphere" class="tab-btn border-b-2 border-elwoic-red py-3 px-1 text-sm font-medium text-elwoic-red whitespace-nowrap">Atmosphere</button>
      <button onclick="switchTab('wind_rain')" id="tab-btn-wind_rain" class="tab-btn border-b-2 border-transparent py-3 px-1 text-sm font-medium text-slate-500 hover:text-slate-700 whitespace-nowrap">Wind & Rain</button>
      <button onclick="switchTab('aqi')" id="tab-btn-aqi" class="tab-btn border-b-2 border-transparent py-3 px-1 text-sm font-medium text-slate-500 hover:text-slate-700 whitespace-nowrap">Air Quality</button>
      <button onclick="switchTab('indoor')" id="tab-btn-indoor" class="tab-btn border-b-2 border-transparent py-3 px-1 text-sm font-medium text-slate-500 hover:text-slate-700 whitespace-nowrap">Indoor</button>
    </nav>
  </div>

  <!-- Graph Grid Container -->
  <div class="max-w-6xl mx-auto">
    <div id="graphs-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Graphs injected here -->
    </div>
  </div>

  <!-- EXPAND MODAL -->
  <div id="expand-modal" class="hidden fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl overflow-hidden flex flex-col max-h-[90vh]">
      
      <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h2 id="modal-title" class="text-xl font-bold text-slate-800">Graph Details</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-2">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      
      <div class="p-6 flex flex-col lg:flex-row gap-6 overflow-y-auto">
        <div class="flex-grow relative h-[300px] md:h-[400px] lg:h-[500px]">
          <canvas id="modalChart"></canvas>
        </div>
        
        <div class="w-full lg:w-64 flex flex-col gap-4">
          <h3 class="font-semibold text-slate-800 uppercase tracking-wider text-xs">Trend Analysis</h3>
          <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
            <p class="text-xs text-slate-500 mb-1">Current</p>
            <p id="trend-current" class="text-2xl font-bold text-slate-800">--</p>
          </div>
          <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
            <p class="text-xs text-slate-500 mb-1">Average</p>
            <p id="trend-avg" class="text-xl font-semibold text-slate-700">--</p>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-red-50 p-3 rounded-xl border border-red-100">
              <p class="text-[10px] text-red-500 uppercase font-bold mb-1">High</p>
              <p id="trend-max" class="text-lg font-semibold text-red-700">--</p>
            </div>
            <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
              <p class="text-[10px] text-blue-500 uppercase font-bold mb-1">Low</p>
              <p id="trend-min" class="text-lg font-semibold text-blue-700">--</p>
            </div>
          </div>
          <p id="trend-status" class="text-xs text-slate-400 mt-4 italic">Calculating...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://elwoic-charts-api.bold-waterfall-0d01.workers.dev";
    
    let currentGlobalRange = '24h';
    let currentActiveTab = 'atmosphere';
    let activeChartInstances = {}; 
    let modalChartInstance = null;

    // --- AQI COLOR MATH ---
    function pm25ToAQI_aqi(pm) {
      const bp = [
        {cL:0, cH:12, aL:0, aH:50}, {cL:12.1, cH:35.4, aL:51, aH:100}, {cL:35.5, cH:55.4, aL:101, aH:150},
        {cL:55.5, cH:150.4, aL:151, aH:200}, {cL:150.5, cH:250.4, aL:201, aH:300}, {cL:250.5, cH:500, aL:301, aH:500}
      ];
      for(const r of bp) if(pm >= r.cL && pm <= r.cH) return Math.round(((r.aH - r.aL) / (r.cH - r.cL)) * (pm - r.cL) + r.aL);
      return Math.round(pm);
    }

    function getDynamicColor(value, type) {
      if(value === null || isNaN(value)) return '#ccc';
      if(type === 'pm02') {
        const aqi = pm25ToAQI_aqi(value);
        if(aqi <= 50) return '#4caf50';
        if(aqi <= 100) return '#8bc34a';
        if(aqi <= 200) return '#ffc107';
        if(aqi <= 300) return '#ff9800';
        return '#f44336';
      }
      if(type === 'pm10') return value <= 50 ? '#4caf50' : value <= 100 ? '#ffc107' : '#f44336';
      if(type === 'co2') return value <= 800 ? '#4caf50' : value <= 1200 ? '#ffc107' : '#f44336';
      if(type === 'tvoc_index' || type === 'nox_index') return value <= 100 ? '#4caf50' : value <= 200 ? '#ffc107' : '#f44336';
      return '#3b82f6';
    }

    // --- CONFIGURATION ---
    const tabsConfig = {
      atmosphere: [
        { param: 'outdoor_temp', title: 'Temperature', unit: '°C', color: '#ef4444' },
        { param: 'outdoor_humidity', title: 'Humidity', unit: '%', color: '#3b82f6' },
        { param: 'pressure_relative', title: 'Relative Pressure', unit: 'hPa', color: '#8b5cf6' },
        { param: 'solar_radiation', title: 'Solar Radiation', unit: 'W/m²', color: '#f59e0b' },
        { param: 'uvi', title: 'UV Index', unit: 'UVI', color: '#eab308' },
        { param: 'feels_like', title: 'Feels Like', unit: '°C', color: '#ec4899' },
        { param: 'vpd', title: 'Vapor Pressure Deficit', unit: 'kPa', color: '#6366f1' } 
      ],
      wind_rain: [
        { param: 'wind_speed', title: 'Wind Speed', unit: 'km/h', color: '#10b981' },
        { param: 'wind_gust', title: 'Wind Gust', unit: 'km/h', color: '#059669' },
        { param: 'wind_dir', title: 'Wind Direction', unit: '°', color: '#64748b', yMin: 0, yMax: 360 },
        { param: 'rain_rate', title: 'Rain Rate', unit: 'mm/h', color: '#0ea5e9', multiplier: 25.4 },
        { param: 'rain_daily', title: 'Daily Rain', unit: 'mm', color: '#0284c7', multiplier: 25.4 },
        { param: 'dew_point', title: 'Dew Point', unit: '°C', color: '#8b5cf6' }
      ],
      aqi: [
        { param: 'pm02', title: 'PM 2.5 (AQI Scaled)', unit: 'µg/m³', isAqi: true },
        { param: 'pm10', title: 'PM 10', unit: 'µg/m³', isAqi: true },
        { param: 'pm01', title: 'PM 1.0', unit: 'µg/m³', color: '#14b8a6' },
        { param: 'co2', title: 'CO2 Level', unit: 'ppm', isAqi: true },
        { param: 'tvoc_index', title: 'TVOC Index', unit: 'Idx', isAqi: true },
        { param: 'nox_index', title: 'NOx Index', unit: 'Idx', isAqi: true }
      ],
      indoor: [
        { param: 'indoor_temp', title: 'Indoor Temp', unit: '°C', color: '#f43f5e' },
        { param: 'indoor_humidity', title: 'Indoor Humidity', unit: '%', color: '#06b6d4' }
      ]
    };

    const allConfigs = Object.values(tabsConfig).flat();

    window.onload = () => {
      buildQuickNav();
      loadTabGraphs('atmosphere');
    };

    function buildQuickNav() {
      const container = document.getElementById('quick-nav-container');
      allConfigs.forEach(conf => {
        const btn = document.createElement('button');
        btn.className = "px-3 py-1.5 bg-white border border-slate-200 text-slate-600 rounded-full text-xs font-semibold hover:border-elwoic-blue hover:text-elwoic-blue transition-colors";
        btn.innerText = conf.title;
        btn.onclick = () => fetchAndOpenModal(conf);
        container.appendChild(btn);
      });
    }

    function switchTab(tabId) {
      if(currentActiveTab === tabId) return;
      currentActiveTab = tabId;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = "tab-btn border-b-2 border-transparent py-3 px-1 text-sm font-medium text-slate-500 hover:text-slate-700 whitespace-nowrap";
      });
      const activeBtn = document.getElementById(`tab-btn-${tabId}`);
      activeBtn.className = "tab-btn border-b-2 border-elwoic-red py-3 px-1 text-sm font-medium text-elwoic-red whitespace-nowrap";
      loadTabGraphs(tabId);
    }

    function setGlobalRange(range) {
      currentGlobalRange = range;
      document.querySelectorAll('.global-range-btn').forEach(btn => {
        btn.className = "global-range-btn px-4 py-1.5 text-sm font-medium rounded-md text-slate-500 hover:text-slate-800 transition-all";
      });
      document.getElementById(`btn-global-${range}`).className = "global-range-btn px-4 py-1.5 text-sm font-medium rounded-md bg-white shadow-sm text-slate-800 transition-all";
      loadTabGraphs(currentActiveTab);
    }

    async function fetchAndOpenModal(conf) {
      const modal = document.getElementById('expand-modal');
      document.getElementById('modal-title').innerText = "Loading " + conf.title + "...";
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
      
      try {
        const res = await fetch(`${API_BASE}/?param=${conf.param}&range=${currentGlobalRange}`);
        const json = await res.json();
        
        const processedData = conf.multiplier 
          ? json.data.map(v => v !== null ? (v * conf.multiplier) : null) 
          : json.data;

        conf.cachedLabels = json.labels;
        conf.cachedData = processedData;
        
        document.getElementById('modal-title').innerText = conf.title;
        if(modalChartInstance) modalChartInstance.destroy();
        const ctx = document.getElementById('modalChart').getContext('2d');
        modalChartInstance = createChart(ctx, conf.cachedLabels, conf.cachedData, conf, true);
        calculateTrends(conf.cachedData, conf.unit);
      } catch (err) {
        document.getElementById('modal-title').innerText = "Error loading data";
      }
    }

    async function loadTabGraphs(tabId) {
      const grid = document.getElementById('graphs-grid');
      grid.innerHTML = ''; 
      Object.keys(activeChartInstances).forEach(key => activeChartInstances[key].destroy());
      activeChartInstances = {};

      const configs = tabsConfig[tabId];

      configs.forEach(conf => {
        const cardHtml = `
          <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4 flex flex-col relative h-[300px]">
            <div class="flex justify-between items-center mb-2">
              <h3 class="font-semibold text-slate-700">${conf.title}</h3>
              <button onclick='openModalFromTab(${JSON.stringify(conf)})' class="text-slate-400 hover:text-elwoic-blue transition-colors p-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
              </button>
            </div>
            <div id="loader-${conf.param}" class="absolute inset-0 flex items-center justify-center bg-white/80 z-10 rounded-xl">
              <span class="text-xs font-medium text-slate-400 animate-pulse">Loading...</span>
            </div>
            <div class="flex-grow relative w-full h-full">
              <canvas id="canvas-${conf.param}"></canvas>
            </div>
          </div>
        `;
        grid.insertAdjacentHTML('beforeend', cardHtml);
      });

      configs.forEach(async (conf) => {
        try {
          const res = await fetch(`${API_BASE}/?param=${conf.param}&range=${currentGlobalRange}`);
          const json = await res.json();
          
          const processedData = conf.multiplier 
            ? json.data.map(v => v !== null ? (v * conf.multiplier) : null) 
            : json.data;

          document.getElementById(`loader-${conf.param}`).style.display = 'none';
          const ctx = document.getElementById(`canvas-${conf.param}`).getContext('2d');
          
          activeChartInstances[conf.param] = createChart(ctx, json.labels, processedData, conf, false);
          
          conf.cachedLabels = json.labels;
          conf.cachedData = processedData;
        } catch (err) {
          document.getElementById(`loader-${conf.param}`).innerHTML = '<span class="text-xs text-red-400">Failed to load</span>';
        }
      });
    }

    function createChart(ctx, labels, data, config, isLargeModal) {
      const showDots = currentGlobalRange !== '24h' || isLargeModal;
      
      const chartOptions = {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: `${config.title} (${config.unit})`,
            data: data,
            borderColor: config.isAqi ? '#ccc' : (config.color || '#3b82f6'),
            borderWidth: isLargeModal ? 2 : 1.5,
            pointRadius: showDots ? (isLargeModal ? 3 : 1) : 0,
            pointHoverRadius: 5,
            fill: !config.isAqi, 
            tension: 0.2,
            spanGaps: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { intersect: false, mode: 'index' },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(15, 23, 42, 0.9)',
              callbacks: { label: (ctx) => `${ctx.parsed.y.toFixed(2)} ${config.unit}` }
            }
          },
          scales: {
            x: { grid: { display: false }, ticks: { maxTicksLimit: isLargeModal ? 12 : 6 } },
            y: { grid: { color: '#f1f5f9' }, min: config.yMin, max: config.yMax }
          }
        }
      };

      if (config.isAqi) {
        chartOptions.data.datasets[0].segment = {
          borderColor: (ctx) => getDynamicColor(ctx.p1.parsed.y, config.param)
        };
        chartOptions.data.datasets[0].pointBackgroundColor = (ctx) => getDynamicColor(ctx.raw, config.param);
        chartOptions.data.datasets[0].pointBorderColor = (ctx) => getDynamicColor(ctx.raw, config.param);
      }

      if (config.param === 'wind_dir') {
        chartOptions.options.scales.y.ticks = { stepSize: 90 };
      }

      return new Chart(ctx, chartOptions);
    }

    function openModalFromTab(conf) {
      const activeConfigs = tabsConfig[currentActiveTab];
      const liveConfig = activeConfigs.find(c => c.param === conf.param);
      
      const modal = document.getElementById('expand-modal');
      document.getElementById('modal-title').innerText = liveConfig.title;
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);

      if(modalChartInstance) modalChartInstance.destroy();
      const ctx = document.getElementById('modalChart').getContext('2d');
      modalChartInstance = createChart(ctx, liveConfig.cachedLabels, liveConfig.cachedData, liveConfig, true);
      calculateTrends(liveConfig.cachedData, liveConfig.unit);
    }

    function closeModal() {
      const modal = document.getElementById('expand-modal');
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 300);
    }

    function calculateTrends(dataArray, unit) {
      const validData = dataArray.filter(v => v !== null && !isNaN(v));
      
      if (validData.length === 0) {
        document.getElementById('trend-current').innerText = '--';
        document.getElementById('trend-avg').innerText = '--';
        document.getElementById('trend-max').innerText = '--';
        document.getElementById('trend-min').innerText = '--';
        document.getElementById('trend-status').innerText = "No data available in this period.";
        return;
      }

      const current = validData[validData.length - 1];
      const max = Math.max(...validData);
      const min = Math.min(...validData);
      const avg = (validData.reduce((a, b) => a + b, 0) / validData.length);

      const format = (num) => Number.isInteger(num) ? num : num.toFixed(2);

      document.getElementById('trend-current').innerText = `${format(current)} ${unit}`;
      document.getElementById('trend-avg').innerText = `${format(avg)} ${unit}`;
      document.getElementById('trend-max').innerText = `${format(max)} ${unit}`;
      document.getElementById('trend-min').innerText = `${format(min)} ${unit}`;
      document.getElementById('trend-status').innerText = `Calculated from ${validData.length} records.`;
    }
  </script>
</body>
</html>
