<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELWOIC Weather Scene — V0.5</title>
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020817;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #stage {
        position: relative;
        width: 100vw;
        height: 100vh;
    }
    #scene {
        width: 100%;
        height: 100%;
        display: block;
    }
    #particleCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }
    .hud {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 50;
        width: 320px;
        padding: 16px 18px;
        border-radius: 16px;
        background: rgba(13, 22, 33, 0.78);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
        color: #e2e8f0;
        font-size: 13px;
        user-select: none;
        transition: opacity 0.3s;
    }
    .hud-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .hud-title {
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.5px;
        color: #f8fafc;
    }
    .live-indicator {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
    }
    .live-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 8px #10b981;
    }
    .live-dot.syncing {
        background: #3b82f6;
        box-shadow: 0 0 8px #3b82f6;
    }
    .live-dot.err {
        background: #ef4444;
        box-shadow: 0 0 8px #ef4444;
    }
    .metrics-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 12px;
        margin-bottom: 12px;
    }
    .metric-label {
        font-size: 11px;
        color: #94a3b8;
    }
    .metric-val {
        font-weight: 600;
        font-size: 13px;
        color: #f1f5f9;
    }
    .nowcast-box {
        background: rgba(255, 255, 255, 0.05);
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 11.5px;
        line-height: 1.4;
        color: #cbd5e1;
        margin-bottom: 12px;
        border-left: 3px solid #38bdf8;
    }
    .nowcast-box .ml-txt {
        color: #e2e8f0;
        font-weight: 500;
        margin-bottom: 4px;
    }
    .hud-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10.5px;
        color: #64748b;
    }
    button.manual-refresh {
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: #e2e8f0;
        padding: 4px 8px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 11px;
        transition: background 0.2s;
    }
    button.manual-refresh:hover {
        background: rgba(255, 255, 255, 0.2);
    }
</style>
</head>
<body>

<div id="stage">
    <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Dynamic Sky Gradients -->
            <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#389fd6"/>
                <stop offset="60%" stop-color="#84c5ec"/>
                <stop offset="100%" stop-color="#cae5d9"/>
            </linearGradient>

            <linearGradient id="skyGolden" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#304169"/>
                <stop offset="45%" stop-color="#bf635a"/>
                <stop offset="75%" stop-color="#e08f53"/>
                <stop offset="100%" stop-color="#fcd082"/>
            </linearGradient>

            <linearGradient id="skyTwilight" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#0c122c"/>
                <stop offset="50%" stop-color="#21214c"/>
                <stop offset="85%" stop-color="#462c4a"/>
                <stop offset="100%" stop-color="#693c4e"/>
            </linearGradient>

            <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#010611"/>
                <stop offset="60%" stop-color="#051226"/>
                <stop offset="100%" stop-color="#0c1b33"/>
            </linearGradient>

            <linearGradient id="skyOvercast" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#3b4752"/>
                <stop offset="60%" stop-color="#5a6875"/>
                <stop offset="100%" stop-color="#84919e"/>
            </linearGradient>

            <!-- Ground Gradients -->
            <linearGradient id="groundDay" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#558a36"/>
                <stop offset="100%" stop-color="#23421e"/>
            </linearGradient>
            <linearGradient id="groundNight" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#14281f"/>
                <stop offset="100%" stop-color="#06120b"/>
            </linearGradient>
            <linearGradient id="groundGolden" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#58742d"/>
                <stop offset="100%" stop-color="#253516"/>
            </linearGradient>

            <!-- Celestial Filters & Glows -->
            <radialGradient id="sunGlow">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
                <stop offset="25%" stop-color="#fff4b8" stop-opacity="0.9"/>
                <stop offset="60%" stop-color="#ffbf5e" stop-opacity="0.35"/>
                <stop offset="100%" stop-color="#ff9d3b" stop-opacity="0"/>
            </radialGradient>

            <filter id="softBlur">
                <feGaussianBlur stdDeviation="2"/>
            </filter>
            <filter id="hazeBlur">
                <feGaussianBlur stdDeviation="6"/>
            </filter>

            <!-- Reusable Cloud Silhouettes -->
            <!-- 1. Fair Weather Cumulus -->
            <g id="cloudCumulus">
                <ellipse cx="0" cy="22" rx="72" ry="28"/>
                <ellipse cx="-42" cy="12" rx="40" ry="32"/>
                <ellipse cx="-8" cy="-8" rx="52" ry="46"/>
                <ellipse cx="40" cy="10" rx="48" ry="36"/>
                <ellipse cx="70" cy="22" rx="36" ry="26"/>
            </g>
            <!-- 2. High Wispy Cirrus -->
            <g id="cloudCirrus">
                <path d="M-100,0 C-60,-22 20,-12 80,-25 C120,-32 140,-18 170,-10 C120,-2 60,6 -20,4 C-70,4 -90,-2 -100,0 Z"/>
            </g>
            <!-- 3. Heavy Dark Base Layer -->
            <g id="cloudStratocumulus">
                <ellipse cx="0" cy="30" rx="140" ry="42"/>
                <ellipse cx="-90" cy="14" rx="80" ry="50"/>
                <ellipse cx="-20" cy="-18" rx="110" ry="70"/>
                <ellipse cx="75" cy="5" rx="95" ry="58"/>
                <ellipse cx="140" cy="25" rx="75" ry="40"/>
            </g>

            <!-- Hierarchical Vegetation Assets -->
            <!-- Kerala Coconut Palm Definition -->
            <g id="palmTree">
                <ellipse cx="0" cy="0" rx="40" ry="8" fill="#132415" opacity="0.4"/>
                <!-- Curved Trunk Anchor -->
                <path d="M -8,0 C -12,-90 -22,-180 -12,-280 C -8,-320 -2,-350 4,-375 L 14,-373 C 8,-348 2,-318 -2,-279 C -11,-180 -1,-90 6,0 Z" fill="#4d3826"/>
                <!-- Foliage Assembly with Individual Bend Origins -->
                <g class="palm-crown" transform="translate(9, -374)">
                    <path class="frond frond-l1" d="M0,0 C -40,-20 -110,-10 -150,45 C -115,15 -60,5 0,0" fill="#2d6930"/>
                    <path class="frond frond-l2" d="M0,0 C -50,-50 -130,-40 -175,-5 C -130,-15 -70,-20 0,0" fill="#387a3c"/>
                    <path class="frond frond-l3" d="M0,0 C -35,-80 -90,-110 -135,-90 C -95,-75 -50,-50 0,0" fill="#448d49"/>
                    <path class="frond frond-r1" d="M0,0 C 40,-20 110,-10 150,45 C 115,15 60,5 0,0" fill="#2d6930"/>
                    <path class="frond frond-r2" d="M0,0 C 50,-50 130,-40 175,-5 C 130,-15 70,-20 0,0" fill="#387a3c"/>
                    <path class="frond frond-r3" d="M0,0 C 35,-80 90,-110 135,-90 C 95,-75 50,-50 0,0" fill="#448d49"/>
                </g>
            </g>

            <!-- Broadleaf Field Tree with Independent Bending Branch Layers -->
            <g id="fieldTree">
                <ellipse cx="0" cy="0" rx="55" ry="10" fill="#132415" opacity="0.35"/>
                <!-- Solid Root & Tapered Trunk -->
                <path class="tree-trunk" d="M -11,0 C -9,-70 -6,-135 0,-175 C 6,-135 9,-70 11,0 Z" fill="#422f20"/>
                <!-- Articulated Branch Rig -->
                <g class="branch branch-left" transform="translate(-2,-120)">
                    <path d="M 0,0 C -25,-25 -45,-45 -65,-60" stroke="#422f20" stroke-width="9" stroke-linecap="round" fill="none"/>
                    <circle class="canopy-cluster" cx="-65" cy="-60" r="42" fill="#285a2b"/>
                    <circle class="canopy-cluster" cx="-82" cy="-45" r="32" fill="#326e36"/>
                </g>
                <g class="branch branch-right" transform="translate(2,-135)">
                    <path d="M 0,0 C 25,-20 50,-38 72,-52" stroke="#422f20" stroke-width="8" stroke-linecap="round" fill="none"/>
                    <circle class="canopy-cluster" cx="72" cy="-52" r="44" fill="#285a2b"/>
                    <circle class="canopy-cluster" cx="90" cy="-38" r="30" fill="#326e36"/>
                </g>
                <g class="branch branch-center" transform="translate(0,-170)">
                    <path d="M 0,0 C -5,-30 5,-55 0,-80" stroke="#422f20" stroke-width="7" stroke-linecap="round" fill="none"/>
                    <circle class="canopy-cluster" cx="0" cy="-80" r="54" fill="#224d25"/>
                    <circle class="canopy-cluster" cx="-25" cy="-70" r="38" fill="#285a2b"/>
                    <circle class="canopy-cluster" cx="25" cy="-70" r="38" fill="#326e36"/>
                </g>
            </g>
        </defs>

        <!-- Dynamic Sky Backdrop -->
        <rect id="skyRect" width="1600" height="900" fill="url(#skyDay)"/>
        
        <!-- Celestial Bodies -->
        <g id="sunGroup">
            <circle id="sunAura" cx="1200" cy="220" r="140" fill="url(#sunGlow)"/>
            <circle id="sunCore" cx="1200" cy="220" r="38" fill="#ffffff"/>
        </g>
        <g id="moonGroup" opacity="0">
            <circle id="moonDisc" cx="1200" cy="220" r="34" fill="#e6ecf2"/>
            <path id="moonShadow" d="M 1200,186 A 34 34 0 0 1 1200,254 A 25 34 0 0 0 1200,186" fill="#051226" opacity="0.8"/>
        </g>
        <g id="starField" opacity="0"></g>

        <!-- Parallax Layer 1: Distant Western Ghats Silhouette -->
        <path id="hillsDistant" d="M 0,530 C 220,470 380,495 560,520 C 740,460 920,480 1100,525 C 1280,470 1440,500 1600,520 L 1600,700 L 0,700 Z" fill="#588574" opacity="0.45"/>
        
        <!-- Parallax Layer 2: Mid-range Plantation Canopy -->
        <path id="hillsMid" d="M 0,565 C 180,530 340,545 520,558 C 720,525 900,548 1140,555 C 1360,530 1490,550 1600,560 L 1600,750 L 0,750 Z" fill="#3c6b4d" opacity="0.65"/>

        <!-- Atmospheric Haze Layer -->
        <rect id="hazeRect" width="1600" height="900" fill="#cae5d9" opacity="0.1" pointer-events="none"/>

        <!-- Parallax Layer 3: Dynamic Cloud Layer -->
        <g id="cloudsContainer"></g>

        <!-- Parallax Layer 4: Distant Tree Line & Palms -->
        <g id="distantVegetation" opacity="0.85">
            <use href="#palmTree" transform="translate(180, 575) scale(0.42)"/>
            <use href="#palmTree" transform="translate(230, 580) scale(0.38)"/>
            <use href="#fieldTree" transform="translate(420, 580) scale(0.5)"/>
            <use href="#palmTree" transform="translate(890, 578) scale(0.44)"/>
            <use href="#fieldTree" transform="translate(1320, 582) scale(0.52)"/>
            <use href="#palmTree" transform="translate(1390, 576) scale(0.4)"/>
        </g>

        <!-- Main Ground Geometry -->
        <path id="groundPath" d="M 0,590 C 320,570 580,595 860,580 C 1140,568 1380,592 1600,578 L 1600,900 L 0,900 Z" fill="url(#groundDay)"/>
        
        <!-- Depth Shading on Terrain -->
        <path d="M 0,660 C 350,640 780,670 1150,650 C 1390,638 1520,655 1600,648" fill="none" stroke="#77a84e" stroke-width="4" opacity="0.25"/>
        <path d="M 0,750 C 420,725 820,765 1220,740 C 1440,728 1540,750 1600,742" fill="none" stroke="#2a4d22" stroke-width="6" opacity="0.3"/>

        <!-- Parallax Layer 5: Primary Foreground Vegetation -->
        <g id="foregroundVegetation">
            <!-- Left Copse -->
            <g id="treeLeft" class="tree-instance" transform="translate(290, 630) scale(0.95)"><use href="#fieldTree"/></g>
            <g id="palmLeft" class="palm-instance" transform="translate(140, 645) scale(1.02)"><use href="#palmTree"/></g>
            
            <!-- Midfield Standouts -->
            <g id="treeCenter" class="tree-instance" transform="translate(740, 620) scale(0.8)"><use href="#fieldTree"/></g>
            
            <!-- Right Grove -->
            <g id="palmRight" class="palm-instance" transform="translate(1220, 640) scale(0.92)"><use href="#palmTree"/></g>
            <g id="treeRight" class="tree-instance" transform="translate(1410, 632) scale(1.08)"><use href="#fieldTree"/></g>
        </g>

        <!-- Foreground Field Grass Tuffs (Strictly Anchored) -->
        <g id="grassTufts" stroke="#3d7532" stroke-width="2.6" stroke-linecap="round">
            <!-- Defined with baseline origins [x, y] -->
            <g class="tuft" data-x="90" data-y="680" transform="translate(90, 680)"><path d="M0,0 L-6,-22 M0,0 L1,-26 M0,0 L8,-19"/></g>
            <g class="tuft" data-x="220" data-y="730" transform="translate(220, 730)"><path d="M0,0 L-7,-25 M0,0 L0,-30 M0,0 L8,-22"/></g>
            <g class="tuft" data-x="380" data-y="660" transform="translate(380, 660)"><path d="M0,0 L-5,-20 M0,0 L2,-24 M0,0 L7,-18"/></g>
            <g class="tuft" data-x="510" data-y="780" transform="translate(510, 780)"><path d="M0,0 L-8,-28 M0,0 L-1,-34 M0,0 L9,-25"/></g>
            <g class="tuft" data-x="670" data-y="690" transform="translate(670, 690)"><path d="M0,0 L-6,-22 M0,0 L1,-27 M0,0 L7,-20"/></g>
            <g class="tuft" data-x="840" data-y="740" transform="translate(840, 740)"><path d="M0,0 L-7,-26 M0,0 L0,-32 M0,0 L8,-23"/></g>
            <g class="tuft" data-x="1020" data-y="670" transform="translate(1020, 670)"><path d="M0,0 L-5,-21 M0,0 L2,-25 M0,0 L7,-19"/></g>
            <g class="tuft" data-x="1160" data-y="770" transform="translate(1160, 770)"><path d="M0,0 L-8,-29 M0,0 L-1,-35 M0,0 L9,-26"/></g>
            <g class="tuft" data-x="1340" data-y="710" transform="translate(1340, 710)"><path d="M0,0 L-7,-24 M0,0 L1,-28 M0,0 L8,-21"/></g>
            <g class="tuft" data-x="1510" data-y="680" transform="translate(1510, 680)"><path d="M0,0 L-6,-22 M0,0 L0,-26 M0,0 L7,-19"/></g>
        </g>

        <!-- Fog / Mist Atmospheric Layer -->
        <rect id="fogLayer" width="1600" height="900" fill="#cbd5e1" opacity="0" pointer-events="none"/>
        <!-- Lightning Exposure Screen -->
        <rect id="flashScreen" width="1600" height="900" fill="#ffffff" opacity="0" pointer-events="none"/>
    </svg>

    <!-- Canvas Layer for Precipitation & Microparticles -->
    <canvas id="particleCanvas"></canvas>
</div>

<!-- Realtime ELWOIC Data & Telemetry HUD -->
<div class="hud" id="hud">
    <div class="hud-header">
        <span class="hud-title">ELWOIC V0.5</span>
        <div class="live-indicator">
            <span class="live-dot" id="liveDot"></span>
            <span id="liveStatus">Auto-Sync</span>
        </div>
    </div>
    
    <div class="nowcast-box" id="nowcastBox">
        <div class="ml-txt" id="nowcastMl">കാലാവസ്ഥ ഡാറ്റ ലഭ്യമാക്കുന്നു...</div>
        <div class="en-txt" id="nowcastEn">Connecting to telemetry stream...</div>
    </div>

    <div class="metrics-grid">
        <div>
            <div class="metric-label">Wind Speed / Gust</div>
            <div class="metric-val" id="valWind">-- km/h</div>
        </div>
        <div>
            <div class="metric-label">Wind Direction</div>
            <div class="metric-val" id="valWindDir">--° (---)</div>
        </div>
        <div>
            <div class="metric-label">Rain Status / Rate</div>
            <div class="metric-val" id="valRain">None</div>
        </div>
        <div>
            <div class="metric-label">Cloud Cover</div>
            <div class="metric-val" id="valCloud">--%</div>
        </div>
        <div>
            <div class="metric-label">Outdoor Temp / Heat</div>
            <div class="metric-val" id="valTemp">--°C</div>
        </div>
        <div>
            <div class="metric-label">Solar Elevation</div>
            <div class="metric-val" id="valSolar">--°</div>
        </div>
    </div>

    <div class="hud-footer">
        <span id="lastUpdated">Updated: Just now</span>
        <button class="manual-refresh" id="btnRefresh">Sync Now</button>
    </div>
</div>

<script>
/**
 * ELWOIC Weather Engine V0.5 — Autonomous Telemetry Driver
 */

const ENDPOINTS = {
    live: "https://elwoic-petrichor-dx3n8-stream.bold-waterfall-0d01.workers.dev/live",
    nowcast: "https://elwoic-nowcast-engine.bold-waterfall-0d01.workers.dev"
};

// Global Reactive Physical State
const EngineState = {
    time: 0,
    solarElevation: 38.0,
    solarAzimuth: 110.0,
    windSpeed: 1.6,
    windGust: 2.7,
    windDirDeg: 247,
    windDirSign: 1, // 1: blows L->R, -1: blows R->L
    cloudCoverPct: 51,
    rainRateMmHr: 0,
    isDrizzle: false,
    isRaining: false,
    isStorm: false,
    visibilityMeters: 10000,
    pm25: 20
};

// Initialize Particle Canvas
const canvas = document.getElementById("particleCanvas");
const ctx = canvas.getContext("2d");
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* -------------------------------------------------------------
 * 1. CELESTIAL & SKY ENGINE
 * ------------------------------------------------------------- */
const CelestialEngine = {
    skyRect: document.getElementById("skyRect"),
    sunGroup: document.getElementById("sunGroup"),
    sunAura: document.getElementById("sunAura"),
    sunCore: document.getElementById("sunCore"),
    moonGroup: document.getElementById("moonGroup"),
    starField: document.getElementById("starField"),
    groundPath: document.getElementById("groundPath"),
    hillsDistant: document.getElementById("hillsDistant"),
    hazeRect: document.getElementById("hazeRect"),

    initStars() {
        this.starField.innerHTML = "";
        for (let i = 0; i < 160; i++) {
            const star = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            star.setAttribute("cx", Math.random() * 1600);
            star.setAttribute("cy", Math.random() * 520);
            star.setAttribute("r", (Math.random() * 1.4 + 0.3).toFixed(2));
            star.dataset.phase = Math.random() * Math.PI * 2;
            star.dataset.base = Math.random() * 0.5 + 0.3;
            this.starField.appendChild(star);
        }
    },

    update(solarDeg, cloudCover) {
        // Solar coordinate mapping in SVG space (0 - 1600, 0 - 900)
        // solarDeg: -90 to +90. Zenith (90) = y: 80; Horizon (0) = y: 560; Sub-horizon (<0) = below
        const sunY = 560 - (Math.max(-10, Math.min(85, solarDeg)) / 85) * 460;
        const sunX = 1200; // Consistent western/eastern trajectory point

        this.sunAura.setAttribute("cy", sunY);
        this.sunCore.setAttribute("cy", sunY);
        this.sunAura.setAttribute("cx", sunX);
        this.sunCore.setAttribute("cx", sunX);

        // Sky transition hierarchy based on exact Solar Elevation
        if (EngineState.isStorm) {
            this.skyRect.setAttribute("fill", "url(#skyOvercast)");
            this.groundPath.setAttribute("fill", "url(#groundNight)");
            this.sunGroup.style.opacity = "0";
            this.moonGroup.style.opacity = "0";
            this.starField.style.opacity = "0";
        } else if (solarDeg > 12) {
            // Full Daylight
            this.skyRect.setAttribute("fill", "url(#skyDay)");
            this.groundPath.setAttribute("fill", "url(#groundDay)");
            this.sunGroup.style.opacity = (1 - cloudCover * 0.007).toFixed(2);
            this.moonGroup.style.opacity = "0";
            this.starField.style.opacity = "0";
            this.hazeRect.setAttribute("fill", "#cae5d9");
            this.hazeRect.style.opacity = "0.12";
        } else if (solarDeg > 0 && solarDeg <= 12) {
            // Golden Hour / Sunrise / Sunset
            this.skyRect.setAttribute("fill", "url(#skyGolden)");
            this.groundPath.setAttribute("fill", "url(#groundGolden)");
            this.sunGroup.style.opacity = "0.85";
            this.moonGroup.style.opacity = "0";
            this.starField.style.opacity = "0";
            this.hazeRect.setAttribute("fill", "#fcd082");
            this.hazeRect.style.opacity = "0.22";
        } else if (solarDeg > -12 && solarDeg <= 0) {
            // Nautical / Civil Twilight
            this.skyRect.setAttribute("fill", "url(#skyTwilight)");
            this.groundPath.setAttribute("fill", "url(#groundNight)");
            this.sunGroup.style.opacity = "0";
            this.moonGroup.style.opacity = "0.6";
            this.starField.style.opacity = "0.3";
            this.hazeRect.style.opacity = "0.05";
        } else {
            // Full Night
            this.skyRect.setAttribute("fill", "url(#skyNight)");
            this.groundPath.setAttribute("fill", "url(#groundNight)");
            this.sunGroup.style.opacity = "0";
            this.moonGroup.style.opacity = "0.95";
            this.moonGroup.setAttribute("transform", `translate(0, ${Math.min(200, Math.abs(solarDeg)*2)})`);
            this.starField.style.opacity = (1 - cloudCover * 0.01).toFixed(2);
            this.hazeRect.style.opacity = "0";
        }

        // Distance mountain visibility fading based on Air Quality / Haze
        const visFactor = Math.min(1, EngineState.visibilityMeters / 10000);
        this.hillsDistant.style.opacity = (0.45 * visFactor).toFixed(2);
    }
};

/* -------------------------------------------------------------
 * 2. CLOUD LAYER & PARALLAX ENGINE
 * ------------------------------------------------------------- */
const CloudEngine = {
    container: document.getElementById("cloudsContainer"),
    cloudPool: [],

    init() {
        this.container.innerHTML = "";
        this.cloudPool = [];
        const cloudDefs = [
            { type: "#cloudCumulus", y: 130, scale: 1.1, speedMult: 1.0, baseOpacity: 0.85 },
            { type: "#cloudStratocumulus", y: 90, scale: 1.3, speedMult: 0.7, baseOpacity: 0.75 },
            { type: "#cloudCirrus", y: 40, scale: 1.0, speedMult: 0.4, baseOpacity: 0.5 },
            { type: "#cloudCumulus", y: 220, scale: 0.9, speedMult: 1.25, baseOpacity: 0.9 },
            { type: "#cloudStratocumulus", y: 180, scale: 1.15, speedMult: 0.85, baseOpacity: 0.8 }
        ];

        cloudDefs.forEach((def, index) => {
            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
            use.setAttribute("href", def.type);
            use.setAttribute("fill", "#f8fafc");
            g.appendChild(use);
            this.container.appendChild(g);

            this.cloudPool.push({
                el: g,
                use: use,
                x: index * 340 + Math.random() * 60,
                y: def.y,
                scale: def.scale,
                speedMult: def.speedMult,
                baseOpacity: def.baseOpacity,
                tier: index
            });
        });
    },

    update(time, windSpeed, windSign, cloudPct) {
        // How many clouds activate depending on Cloud Cover Percentage
        const activeCount = Math.ceil((cloudPct / 100) * this.cloudPool.length);

        this.cloudPool.forEach((c, idx) => {
            if (idx >= activeCount) {
                c.el.style.opacity = "0";
                return;
            }

            // Cloud translation driven by live wind speed & wind direction sign
            const driftRate = (1.5 + windSpeed * 0.25) * c.speedMult * windSign;
            c.x += driftRate * 0.05;

            // Screen boundary wrapping
            if (c.x > 1800) c.x = -250;
            if (c.x < -300) c.x = 1750;

            c.el.setAttribute("transform", `translate(${c.x.toFixed(1)}, ${c.y}) scale(${c.scale})`);

            // Tinting clouds based on Storm vs Night vs Day
            let cloudTint = "#f8fafc";
            if (EngineState.isStorm) cloudTint = "#475569";
            else if (EngineState.solarElevation <= 0) cloudTint = "#94a3b8";
            else if (EngineState.solarElevation <= 12) cloudTint = "#fed7aa";

            c.use.setAttribute("fill", cloudTint);
            c.el.style.opacity = (c.baseOpacity * Math.min(1, cloudPct / 40)).toFixed(2);
        });
    }
};

/* -------------------------------------------------------------
 * 3. HIERARCHICAL VEGETATION ENGINE (TRUNK -> BRANCH -> FOLIAGE)
 * ------------------------------------------------------------- */
const VegetationEngine = {
    trees: [
        { id: "treeLeft", base: [290, 630], scale: 0.95 },
        { id: "treeCenter", base: [740, 620], scale: 0.8 },
        { id: "treeRight", base: [1410, 632], scale: 1.08 }
    ],
    palms: [
        { id: "palmLeft", base: [140, 645], scale: 1.02 },
        { id: "palmRight", base: [1220, 640], scale: 0.92 }
    ],
    grassTufts: [...document.querySelectorAll(".tuft")],

    update(time, windSpeed, gustSpeed, windSign) {
        // Organic multi-harmonic oscillation for wind
        const baseFreq = time * (1.2 + windSpeed * 0.06);
        const gustFactor = Math.max(1, (gustSpeed / (windSpeed + 0.1)));
        const windIntensity = (windSpeed * 0.45 + gustSpeed * 0.2) * windSign;

        // Animate Broadleaf Field Trees
        this.trees.forEach((t, i) => {
            const el = document.getElementById(t.id);
            if (!el) return;

            // Trunk: anchored firmly, bends subtly at heavy wind
            const trunkFlex = Math.sin(baseFreq + i * 1.5) * (windIntensity * 0.06);
            el.setAttribute("transform", `translate(${t.base[0]}, ${t.base[1]}) scale(${t.scale}) skewX(${-trunkFlex.toFixed(2)})`);

            // Primary Branches: Bend progressively
            const branches = el.querySelectorAll(".branch");
            branches.forEach((br, bi) => {
                const brSway = Math.sin(baseFreq * 1.4 + i + bi) * (windIntensity * 0.14 * gustFactor);
                const baseRot = bi === 0 ? -12 : bi === 1 ? 14 : 0;
                br.setAttribute("transform", `rotate(${(baseRot + brSway).toFixed(2)})`);
            });

            // Leaf Canopy Clusters: High-frequency secondary flutter
            const leaves = el.querySelectorAll(".canopy-cluster");
            leaves.forEach((lf, li) => {
                const flutter = Math.sin(time * 3.5 + li * 0.8) * (windIntensity * 0.08);
                lf.setAttribute("transform", `translate(${flutter.toFixed(1)}, ${(flutter * 0.5).toFixed(1)})`);
            });
        });

        // Animate Coconut Palms
        this.palms.forEach((p, i) => {
            const el = document.getElementById(p.id);
            if (!el) return;

            // Slender palm trunk sway (anchored at base 0,0)
            const palmLean = Math.sin(baseFreq * 0.9 + i * 2.2) * (windIntensity * 0.16);
            el.setAttribute("transform", `translate(${p.base[0]}, ${p.base[1]}) scale(${p.scale}) skewX(${-palmLean.toFixed(2)})`);

            // Frond crown flutter
            const fronds = el.querySelectorAll(".frond");
            fronds.forEach((fr, fi) => {
                const frondBend = Math.sin(baseFreq * 1.8 + fi * 0.7) * (windIntensity * 0.25);
                fr.setAttribute("transform", `rotate(${frondBend.toFixed(2)})`);
            });
        });

        // Animate Grass Tufts (Strictly Anchored to Terrain)
        this.grassTufts.forEach((tuft, i) => {
            const bx = tuft.dataset.x;
            const by = tuft.dataset.y;
            // Higher frequency deflection around its exact base [bx, by]
            const grassSway = (Math.sin(baseFreq * 2.2 + i * 0.8) * 0.6 + 0.4) * (windIntensity * 0.95);
            tuft.setAttribute("transform", `translate(${bx}, ${by}) rotate(${grassSway.toFixed(1)} 0 0)`);
        });
    }
};

/* -------------------------------------------------------------
 * 4. CANVAS PRECIPITATION & LIGHTNING ENGINE
 * ------------------------------------------------------------- */
const RainEngine = {
    drops: [],
    lightningTimer: 0,
    flashScreen: document.getElementById("flashScreen"),
    fogLayer: document.getElementById("fogLayer"),

    init() {
        this.drops = [];
        for (let i = 0; i < 450; i++) {
            this.drops.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                len: Math.random() * 16 + 10,
                speed: Math.random() * 6 + 14,
                opacity: Math.random() * 0.4 + 0.3
            });
        }
    },

    update(windSpeed, windSign) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Adjust Fog Opacity
        const fogOpacity = EngineState.visibilityMeters < 3000 ? 0.65 : (EngineState.visibilityMeters < 7000 ? 0.3 : 0);
        this.fogLayer.style.opacity = fogOpacity.toString();

        // Handle Active Rainfall or Drizzle
        if (EngineState.isRaining || EngineState.isDrizzle) {
            const windLean = (windSpeed / 10) * 3.5 * windSign;
            const dropCount = EngineState.isDrizzle ? 90 : Math.min(450, 120 + EngineState.rainRateMmHr * 60);

            ctx.lineWidth = EngineState.isDrizzle ? 0.9 : 1.5;
            ctx.strokeStyle = EngineState.isDrizzle 
                ? "rgba(215, 230, 245, 0.35)" 
                : "rgba(190, 220, 250, 0.65)";
            
            ctx.beginPath();
            for (let i = 0; i < dropCount; i++) {
                const d = this.drops[i];
                ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x + windLean, d.y + (EngineState.isDrizzle ? d.len * 0.6 : d.len));

                d.y += EngineState.isDrizzle ? d.speed * 0.45 : d.speed;
                d.x += windLean * 0.6;

                // Screen Boundary Wrap
                if (d.y > canvas.height) {
                    d.y = -20;
                    d.x = Math.random() * (canvas.width + 200) - 100;
                }
            }
            ctx.stroke();
        }

        // Thunderstorm Lightning Discharge
        if (EngineState.isStorm && Date.now() > this.lightningTimer) {
            this.flashScreen.style.opacity = "0.85";
            setTimeout(() => { this.flashScreen.style.opacity = "0"; }, 50);
            setTimeout(() => { this.flashScreen.style.opacity = "0.5"; }, 120);
            setTimeout(() => { this.flashScreen.style.opacity = "0"; }, 180);
            this.lightningTimer = Date.now() + Math.random() * 8000 + 4000;
        }
    }
};

/* -------------------------------------------------------------
 * 5. AUTONOMOUS DATA SYNC PIPELINE
 * ------------------------------------------------------------- */
const TelemetryAdapter = {
    liveDot: document.getElementById("liveDot"),
    liveStatus: document.getElementById("liveStatus"),
    nowcastMl: document.getElementById("nowcastMl"),
    nowcastEn: document.getElementById("nowcastEn"),
    valWind: document.getElementById("valWind"),
    valWindDir: document.getElementById("valWindDir"),
    valRain: document.getElementById("valRain"),
    valCloud: document.getElementById("valCloud"),
    valTemp: document.getElementById("valTemp"),
    valSolar: document.getElementById("valSolar"),
    lastUpdated: document.getElementById("lastUpdated"),

    async sync() {
        this.liveDot.className = "live-dot syncing";
        this.liveStatus.textContent = "Syncing...";

        try {
            // Concurrent execution of both telemetry endpoints
            const [liveRes, nowcastRes] = await Promise.allSettled([
                fetch(ENDPOINTS.live).then(r => r.json()),
                fetch(ENDPOINTS.nowcast).then(r => r.json())
            ]);

            let liveData = liveRes.status === "fulfilled" ? liveRes.value : null;
            let nowcastData = nowcastRes.status === "fulfilled" ? nowcastRes.value : null;

            this.applyTelemetry(liveData, nowcastData);
            this.liveDot.className = "live-dot";
            this.liveStatus.textContent = "Live Stream";
            this.lastUpdated.textContent = "Updated: " + new Date().toLocaleTimeString();
        } catch (err) {
            console.warn("Telemetry polling issue:", err);
            this.liveDot.className = "live-dot err";
            this.liveStatus.textContent = "Offline Hold";
        }
    },

    applyTelemetry(live, nowcast) {
        // 1. Wind & Gust Telemetry
        if (live?.live_data?.wind) {
            EngineState.windSpeed = live.live_data.wind.speed_kmh || 0.1;
            EngineState.windGust = live.live_data.wind.gust_kmh || EngineState.windSpeed;
            EngineState.windDirDeg = live.live_data.wind.direction_degrees || 250;
            // Determine sign: 0-180deg blows right-to-left (-1), 180-360deg blows left-to-right (1)
            EngineState.windDirSign = (EngineState.windDirDeg > 180) ? 1 : -1;

            this.valWind.textContent = `${EngineState.windSpeed.toFixed(1)} / ${EngineState.windGust.toFixed(1)} km/h`;
            this.valWindDir.textContent = `${EngineState.windDirDeg}° (${live.live_data.wind.direction_compass || "W"})`;
        }

        // 2. Solar Elevation & Visibility
        if (nowcast?.analytics) {
            EngineState.solarElevation = nowcast.analytics.solar_elevation_deg ?? 35;
            EngineState.visibilityMeters = nowcast.analytics.visibility_m ?? 10000;
            EngineState.pm25 = nowcast.analytics.pm2_5 ?? 20;
            this.valSolar.textContent = `${EngineState.solarElevation.toFixed(1)}°`;
        }

        // 3. Temperature
        if (live?.live_data?.temperature) {
            this.valTemp.textContent = `${live.live_data.temperature.outdoor}°C (Feels ${live.live_data.temperature.feels_like_outdoor}°C)`;
        }

        // 4. Cloud Cover
        if (nowcast?.conditions?.sky_cloud) {
            EngineState.cloudCoverPct = nowcast.conditions.sky_cloud.cloudiness_pct ?? 50;
            this.valCloud.textContent = `${EngineState.cloudCoverPct}%`;
        }

        // 5. Piezo Drizzle & Tipping Bucket Rain Arbiter
        let rainRate = live?.live_data?.rain?.rate_mm_hr || 0;
        let isPiezoActive = false;

        if (nowcast?.verification?.piezo_raw && Array.isArray(nowcast.verification.piezo_raw)) {
            // Check the most recent 5 records in piezo series
            const recentPiezo = nowcast.verification.piezo_raw.slice(-5);
            isPiezoActive = recentPiezo.some(p => p.v === 1);
        }

        EngineState.rainRateMmHr = rainRate;
        if (rainRate > 0) {
            EngineState.isRaining = true;
            EngineState.isDrizzle = false;
            this.valRain.textContent = `Raining (${rainRate.toFixed(1)} mm/h)`;
        } else if (isPiezoActive) {
            // Strict rule: Piezo registered wetness, but bucket has not tipped yet
            EngineState.isRaining = false;
            EngineState.isDrizzle = true;
            this.valRain.textContent = `Light Drizzle (Piezo Sensor)`;
        } else {
            EngineState.isRaining = false;
            EngineState.isDrizzle = false;
            this.valRain.textContent = `No Rain`;
        }

        // 6. Thunderstorm State
        EngineState.isStorm = nowcast?.conditions?.thunderstorm?.active || false;

        // 7. Update HUD Nowcast Text
        if (nowcast?.nowcast) {
            this.nowcastMl.textContent = nowcast.nowcast.ml;
            this.nowcastEn.textContent = nowcast.nowcast.en;
        }

        // Direct updates to sky & clouds
        CelestialEngine.update(EngineState.solarElevation, EngineState.cloudCoverPct);
    }
};

/* -------------------------------------------------------------
 * 6. CORE ANIMATION MASTER LOOP
 * ------------------------------------------------------------- */
let lastFrameTime = performance.now();

function animate(currentTime) {
    const dt = (currentTime - lastFrameTime) * 0.001;
    lastFrameTime = currentTime;
    EngineState.time += dt;

    // Tick Engines
    CloudEngine.update(EngineState.time, EngineState.windSpeed, EngineState.windDirSign, EngineState.cloudCoverPct);
    VegetationEngine.update(EngineState.time, EngineState.windSpeed, EngineState.windGust, EngineState.windDirSign);
    RainEngine.update(EngineState.windSpeed, EngineState.windDirSign);

    requestAnimationFrame(animate);
}

// Initial Boot Sequence
CelestialEngine.initStars();
CloudEngine.init();
RainEngine.init();
CelestialEngine.update(EngineState.solarElevation, EngineState.cloudCoverPct);

// Initial Sync & 60-Second Recurring Poll
TelemetryAdapter.sync();
setInterval(() => TelemetryAdapter.sync(), 60000);

document.getElementById("btnRefresh").addEventListener("click", () => TelemetryAdapter.sync());
requestAnimationFrame(animate);
</script>
