<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ELWOIC — Admin Credential Vault</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #0f766e;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 2rem 1rem; }
    .container { max-width: 820px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    h1 { font-size: 1.25rem; margin: 0; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; }
    input, select { width: 100%; padding: 0.55rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
    button { padding: 0.55rem 1rem; border: none; border-radius: 6px; background: var(--primary); color: #fff; font-weight: 500; cursor: pointer; }
    button.secondary { background: #e2e8f0; color: var(--text); }
    button.danger { background: var(--danger); }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.65rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    .hidden { display: none; }
    .status { font-size: 0.85rem; color: var(--danger); margin-top: 0.5rem; }
    code { background: #f1f5f9; padding: 0.15rem 0.35rem; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ELWOIC Admin Vault</h1>
      <button id="logoutBtn" class="secondary hidden">Sign Out</button>
    </header>

    <!-- STEP 1: Firebase Login -->
    <div id="firebaseLoginCard" class="card">
      <h3>Step 1 — Firebase Authentication</h3>
      <div class="grid">
        <input id="fbEmail" type="email" placeholder="Admin Email" />
        <input id="fbPass" type="password" placeholder="Firebase Password" />
        <button id="fbLoginBtn">Continue</button>
      </div>
      <div id="fbStatus" class="status"></div>
    </div>

    <!-- STEP 2: Cloudflare Worker Secondary Gate -->
    <div id="workerLoginCard" class="card hidden">
      <h3>Step 2 — Cloudflare Worker Verification</h3>
      <div class="grid">
        <input id="wkUser" type="text" placeholder="Worker Username" />
        <input id="wkPass" type="password" placeholder="Worker Password" />
        <button id="wkLoginBtn">Unlock Vault</button>
      </div>
      <div id="wkStatus" class="status"></div>
    </div>

    <!-- STEP 3: Vault Manager -->
    <div id="vaultSection" class="hidden">
      <div class="card">
        <h3>Add / Update Credential</h3>
        <div class="grid" style="margin-bottom: 0.75rem;">
          <input id="serviceName" placeholder="Service (e.g., IMD API, Resend)" />
          <select id="category">
            <option value="api_key">API Key</option>
            <option value="account">Account Login</option>
            <option value="webhook">Webhook / Token</option>
          </select>
          <input id="username" placeholder="Username / Email (optional)" />
          <input id="secretValue" type="password" placeholder="Password / API Key" />
        </div>
        <div class="grid">
          <input id="notes" placeholder="Notes (e.g., Renewal date, endpoint)" />
          <button id="saveBtn">Encrypt & Save to Firestore</button>
        </div>
        <div id="vaultStatus" class="status"></div>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Service</th>
              <th>Category</th>
              <th>Username</th>
              <th>Secret</th>
              <th>Notes</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="vaultTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const WORKER_URL = "https://elwoic-credentials.aswanthkrishnak822.workers.dev";
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyC_Ckz9wFQxXgWivmvIt5ISp7bT9tWbxCY",
      authDomain: "elwoic.firebaseapp.com",
      projectId: "elwoic",
    };

    const app = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    let workerToken = sessionStorage.getItem("elwoic_worker_token") || "";

    const $ = (id) => document.getElementById(id);

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        $("firebaseLoginCard").classList.remove("hidden");
        $("workerLoginCard").classList.add("hidden");
        $("vaultSection").classList.add("hidden");
        $("logoutBtn").classList.add("hidden");
        return;
      }
      $("logoutBtn").classList.remove("hidden");
      $("firebaseLoginCard").classList.add("hidden");

      if (workerToken) {
        $("workerLoginCard").classList.add("hidden");
        $("vaultSection").classList.remove("hidden");
        loadVault();
      } else {
        $("workerLoginCard").classList.remove("hidden");
      }
    });

    $("fbLoginBtn").onclick = async () => {
      $("fbStatus").textContent = "";
      try {
        await signInWithEmailAndPassword(auth, $("fbEmail").value.trim(), $("fbPass").value);
      } catch (e) {
        $("fbStatus").textContent = e.message;
      }
    };

    $("wkLoginBtn").onclick = async () => {
      $("wkStatus").textContent = "";
      try {
        const idToken = await auth.currentUser.getIdToken();
        const res = await fetch(`${WORKER_URL}/api/worker-login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${idToken}`,
          },
          body: JSON.stringify({
            username: $("wkUser").value.trim(),
            password: $("wkPass").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Login failed");

        workerToken = data.workerToken;
        sessionStorage.setItem("elwoic_worker_token", workerToken);
        $("workerLoginCard").classList.add("hidden");
        $("vaultSection").classList.remove("hidden");
        loadVault();
      } catch (e) {
        $("wkStatus").textContent = e.message;
      }
    };

    $("logoutBtn").onclick = async () => {
      sessionStorage.removeItem("elwoic_worker_token");
      workerToken = "";
      await signOut(auth);
    };

    async function apiCall(path, options = {}) {
      const idToken = await auth.currentUser.getIdToken();
      const res = await fetch(`${WORKER_URL}${path}`, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${idToken}`,
          "X-Worker-Token": workerToken,
          ...(options.headers || {}),
        },
      });
      if (res.status === 401 || res.status === 403) {
        sessionStorage.removeItem("elwoic_worker_token");
        workerToken = "";
        location.reload();
      }
      return res;
    }

    async function loadVault() {
      const res = await apiCall("/api/vault");
      const data = await res.json();
      const tbody = $("vaultTable");
      tbody.innerHTML = "";

      (data.items || []).forEach((item) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${escapeHtml(item.serviceName)}</strong></td>
          <td>${escapeHtml(item.category)}</td>
          <td>${escapeHtml(item.username || "—")}</td>
          <td><code>••••••••</code></td>
          <td>${escapeHtml(item.notes || "")}</td>
          <td>
            <button class="secondary copyBtn">Copy</button>
            <button class="danger delBtn">Delete</button>
          </td>
        `;
        tr.querySelector(".copyBtn").onclick = () => {
          navigator.clipboard.writeText(item.secretValue);
          tr.querySelector(".copyBtn").textContent = "Copied!";
          setTimeout(() => (tr.querySelector(".copyBtn").textContent = "Copy"), 1500);
        };
        tr.querySelector(".delBtn").onclick = async () => {
          if (!confirm(`Delete ${item.serviceName}?`)) return;
          await apiCall(`/api/vault/${encodeURIComponent(item.id)}`, { method: "DELETE" });
          loadVault();
        };
        tbody.appendChild(tr);
      });
    }

    $("saveBtn").onclick = async () => {
      $("vaultStatus").textContent = "";
      const payload = {
        serviceName: $("serviceName").value.trim(),
        category: $("category").value,
        username: $("username").value.trim(),
        secretValue: $("secretValue").value,
        notes: $("notes").value.trim(),
      };
      if (!payload.serviceName || !payload.secretValue) {
        $("vaultStatus").textContent = "Service name and secret are required.";
        return;
      }
      const res = await apiCall("/api/vault", {
        method: "POST",
        body: JSON.stringify(payload),
      });
      if (res.ok) {
        $("serviceName").value = "";
        $("username").value = "";
        $("secretValue").value = "";
        $("notes").value = "";
        loadVault();
      } else {
        const err = await res.json();
        $("vaultStatus").textContent = err.error || "Failed to save";
      }
    };

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }
  </script>
</body>
</html>
